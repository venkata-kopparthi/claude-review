[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-review"
version = "0.1.0"
description = "Review your git changes with Claude before you push."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
claude-review = "claude_review.cli:main_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_review"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
